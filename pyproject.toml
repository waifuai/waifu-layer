[project]
name = "waifu-layer"
version = "1.0.0"
description = "WAIFU - The Agentic Layer 1 Blockchain"
requires-python = ">=3.10"
dependencies = [
    "blake3>=0.4",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
